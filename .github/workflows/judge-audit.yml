name: Blinded FAQ answer triage
on:
  push:
    branches: [audit/independent-qrels]
    paths: [.github/workflows/judge-audit.yml]
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blinded packet
        run: |
          python scripts/build_judgment_audit.py --lexical results/independent-evaluation.json.gz --e5 results/independent-open-vector.json.gz --gemini results/independent-gemini-results.json.gz --packet judgment-packet.json --key judgment-key.json
      - name: Trial three answer judgments
        if: env.GEMINI_API_KEY != ''
        run: |
          pip install google-genai pydantic
          python scripts/judge_audit.py --packet judgment-packet.json --output provisional-judgments.json --limit 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinded-judgment-trial
          path: |
            judgment-packet.json
            judgment-key.json
            provisional-judgments.json
