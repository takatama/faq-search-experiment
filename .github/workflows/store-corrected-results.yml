name: Store corrected question-only results
on:
  push:
    branches: [audit/independent-qrels]
    paths: [.github/workflows/store-corrected-results.yml]
jobs:
  store:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download successful question-only run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36151690275 -R takatama/faq-search-experiment -n independent-faq-evaluation -D /tmp/faq-corrected/lexical
          gh run download 36151690275 -R takatama/faq-search-experiment -n independent-open-vector-evaluation -D /tmp/faq-corrected/e5
          gh run download 36151690275 -R takatama/faq-search-experiment -n independent-vector-evaluation -D /tmp/faq-corrected/gemini
      - name: Verify and store results
        run: |
          python - <<'PY'
          import gzip, json
          paths = {
              'lexical': '/tmp/faq-corrected/lexical/evaluation.json',
              'e5': '/tmp/faq-corrected/e5/independent-open-vector.json.gz',
              'gemini': '/tmp/faq-corrected/gemini/independent-vector-results.json',
          }
          data = {}
          for name, path in paths.items():
              with (gzip.open(path, 'rt') if path.endswith('.gz') else open(path)) as f:
                  data[name] = json.load(f)
          assert data['lexical']['summary']['char_tfidf']['grade2']['hit3'] == 197
          assert data['lexical']['summary']['char_bm25']['grade2']['hit3'] == 163
          assert data['e5']['document_field'] == 'FAQ question only'
          assert data['e5']['summary']['grade2']['hit3'] == 373
          assert data['gemini']['document_field'] == 'FAQ question only'
          assert data['gemini']['dimensions'] == 768
          assert data['gemini']['summary']['grade2']['hit3'] == 496
          assert len(data['gemini']['rankings']) == 749
          PY
          mkdir -p results/superseded
          git mv results/independent-evaluation.json.gz results/superseded/
          git mv results/independent-open-vector.json.gz results/superseded/
          git mv results/independent-gemini-results.json.gz results/superseded/
          git mv results/independent-gemini-vectors.json.gz results/superseded/
          gzip -n -c /tmp/faq-corrected/lexical/evaluation.json > results/independent-evaluation.json.gz
          cp /tmp/faq-corrected/e5/independent-open-vector.json.gz results/independent-open-vector.json.gz
          gzip -n -c /tmp/faq-corrected/gemini/independent-vector-results.json > results/independent-gemini-results.json.gz
          cp /tmp/faq-corrected/gemini/independent-vectors.json.gz results/independent-gemini-vectors.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git commit -m 'Store corrected question-only rankings and vectors [skip ci]'
          git push origin HEAD:audit/independent-qrels
