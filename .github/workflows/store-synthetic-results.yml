name: Store synthetic FAQ comparison
on:
  push:
    branches: [audit/independent-qrels]
    paths: [.github/workflows/store-synthetic-results.yml]
  workflow_dispatch:
jobs:
  store:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download successful fixed comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36226164276 -R takatama/faq-search-experiment -n synthetic-query-comparison -D /tmp/faq-synthetic
      - name: Validate and save complete evidence
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          base=Path('/tmp/faq-synthetic')
          generation=json.loads((base/'synthetic-query-generation.json').read_text())
          assert len(generation)==1786 and all(len(v)==5 for v in generation.values())
          result=json.loads((base/'synthetic-query-results.json').read_text())
          assert len(result['rankings'])==749 and result['summary']['baseline']['hit3']==496
          assert result['summary']['joined']['hit3']==474
          assert result['summary']['multi']['hit3']==506
          assert len(result['changes']['joined']['rescued'])==38
          assert len(result['changes']['joined']['lost'])==60
          assert len(result['changes']['multi']['rescued'])==46
          assert len(result['changes']['multi']['lost'])==36
          with gzip.open(base/'synthetic-query-vectors.json.gz','rt') as f: vectors=json.load(f)
          assert len(vectors)==1786*6
          Path('results/independent-synthetic-generation.json.gz').write_bytes(gzip.compress(json.dumps(generation,ensure_ascii=False,separators=(',',':')).encode()))
          Path('results/independent-synthetic-rankings.json.gz').write_bytes(gzip.compress(json.dumps(result,ensure_ascii=False,separators=(',',':')).encode()))
          Path('results/independent-synthetic-vectors.json.gz').write_bytes((base/'synthetic-query-vectors.json.gz').read_bytes())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/independent-synthetic-*.json.gz
          git commit -m 'Store generated queries, 768d vectors and all retrieval rankings [skip ci]'
          git push origin HEAD:audit/independent-qrels
