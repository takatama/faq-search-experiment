name: Store verified Gemini evaluation
on:
  push:
    branches: [experiment/independent-faq-benchmark]
    paths: [.github/workflows/store-independent-gemini.yml]
jobs:
  store:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download completed evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36138830512 -R takatama/faq-search-experiment -n independent-vector-evaluation -D /tmp/faq-embed
      - name: Store cache and exact rankings
        run: |
          gzip -n -c /tmp/faq-embed/independent-vector-results.json > results/independent-gemini-results.json.gz
          cp /tmp/faq-embed/independent-vectors.json.gz results/independent-gemini-vectors.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/independent-gemini-results.json.gz results/independent-gemini-vectors.json.gz
          git commit -m 'Store verified Gemini rankings and embedding cache [skip ci]'
          git push origin HEAD:experiment/independent-faq-benchmark
