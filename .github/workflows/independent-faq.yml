name: Independent FAQ benchmark
on:
  push:
    branches: [audit/independent-qrels]
    paths: [.github/workflows/independent-faq.yml]
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate pinned public data
        run: python scripts/independent_eval.py --output evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: independent-faq-evaluation
          path: evaluation.json
  vector:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse unchanged query embeddings from previous run
        if: env.GEMINI_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36138830512 -R takatama/faq-search-experiment -n independent-vector-evaluation -D /tmp/faq-embed
          cp /tmp/faq-embed/independent-vectors.json.gz independent-vectors.json.gz
      - name: Run vector evaluation when a key is configured
        if: env.GEMINI_API_KEY != ''
        run: |
          pip install google-genai numpy
          python scripts/independent_vector.py
      - uses: actions/upload-artifact@v4
        if: env.GEMINI_API_KEY != ''
        with:
          name: independent-vector-evaluation
          path: |
            independent-vector-results.json
            independent-vectors.json.gz
  open_vector:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU embedding runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'sentence-transformers==5.1.1' numpy
      - name: Evaluate pinned E5 model
        run: python scripts/independent_open_vector.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-open-vector-evaluation
          path: independent-open-vector.json.gz
